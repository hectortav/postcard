name: Bug report
description: Something postcard did that it should not have
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what postcard did instead of what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `postcard --version`.
      placeholder: postcard 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: flags
    attributes:
      label: Flags
      description: How you started postcard.
      placeholder: --path ~/Desktop --pin
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: >
        Anything postcard printed. Do not paste the line starting `BIND` or the PIN: the URL
        fragment is the encryption key.
      render: text
