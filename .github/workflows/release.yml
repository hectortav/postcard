name: release

# Tag-triggered installer pipeline. Push a `v*.*.*` tag (e.g. `v0.1.0`) and
# this workflow builds the platform-native installers (`.dmg` / `.msi` /
# `.deb`) and uploads them as release artifacts.
#
# The landing page deploys to GitHub Pages after the installers build, on the
# same `v*.*.*` tag. Pages must be enabled for the repo with its source set to
# "GitHub Actions" (Settings -> Pages), or the deploy step fails.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: build-installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-release-${{ hashFiles('apps/cli-server/**/*.kts', 'apps/cli-server/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-release-
            gradle-${{ runner.os }}-

      - name: Check the tag matches the project version
        shell: bash
        run: |
          # The tag used to be cut by hand with nothing comparing it to the version in the
          # build, so v0.0.2 shipped binaries reporting 0.1.0.
          project=$(grep -m1 '^version = ' apps/cli-server/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$project" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the project version $project."
            echo "Run: node scripts/bump-version.mjs $tag"
            exit 1
          fi
          echo "version $project matches tag $GITHUB_REF_NAME"

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

      # The shadow JAR is the seed for jpackage's app-image step.
      - run: cd apps/cli-server && ./gradlew shadowJar

      # Chromium natives for this runner's platform, bundled into the installer so a first
      # launch never needs the network -- postcard is usually reached for offline, on a LAN.
      # ~300MB per platform, which is why this runs per-runner rather than once.
      - name: Install JCEF natives
        run: cd apps/cli-server && ./gradlew installCefNatives

      # Pick the right jpackage task per OS. Each task is gated inside
      # build.gradle.kts so a wrong-OS run is a no-op with a clear log
      # line rather than a cryptic tool failure.
      - name: Build installer
        run: cd apps/cli-server && ./gradlew ${{ matrix.os == 'macos-latest' && 'jpackageDmg' || (matrix.os == 'windows-latest' && 'jpackageMsi' || 'jpackageDeb') }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: postcard-installer-${{ matrix.os }}
          # .dmg / .msi / .deb live at the top of dist/installer; the
          # app-image dir is a sibling of equal interest to anyone who
          # wants the binary without an installer wrapper.
          # `build/dist/app-image/*` used to be listed here and matched nothing: the app
          # image is written to dist/postcard.app (macOS) or dist/postcard. It survived only
          # because a second path made upload-artifact keep the `dist/` prefix that the
          # publish job's glob relied on, so removing it means naming the real path below.
          path: apps/cli-server/build/dist/installer/*
          if-no-files-found: error

  # Publish the installers as an actual GitHub Release. Without this the workflow only
  # produced run-scoped artifacts: the Releases page stayed empty, and the landing page's
  # /releases/latest lookup 404'd forever, so it showed "Coming soon" no matter how many
  # tags were cut.
  publish:
    name: publish-release
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needed for CHANGELOG.md, which supplies the release notes.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: postcard-installer-*
          merge-multiple: true

      - name: Checksum every artifact
        run: |
          # Without this there is nothing to verify a download against. GitHub records a
          # per-asset digest, but nothing publishes it next to the files.
          cd artifacts
          find . -type f ! -name 'SHASUMS256.txt' -exec shasum -a 256 {} + \
            | sed 's| \./| |' > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Not a draft and not a prerelease: /releases/latest, which the landing page
          # queries, skips both.
          notes=$(mktemp)
          if [ -f CHANGELOG.md ]; then
            # Everything under this version's heading, up to the next one.
            awk -v tag="${GITHUB_REF_NAME#v}" '
              $0 ~ "^## \\[?" tag {found=1; next}
              found && /^## / {exit}
              found {print}
            ' CHANGELOG.md > "$notes"
          fi
          if [ -s "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "postcard $GITHUB_REF_NAME" \
              --notes-file "$notes" \
              artifacts/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "postcard $GITHUB_REF_NAME" \
              --generate-notes \
              artifacts/*
          fi

  pages:
    name: deploy-landing-page
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Declaring any permission zeroes the rest, so checkout needs contents: read
      # spelled out here even though it is a default elsewhere.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @postcard/landing build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing/dist
      - id: deployment
        uses: actions/deploy-pages@v4
