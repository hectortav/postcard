[versions]
javalin = "6.3.0"
# Javalin 6.3.0 owns the Jetty version via its jetty-bom import (Jetty 11.0.23).
# We do not pin Jetty here because the brief's "12.0.10" pin conflicts with Javalin's
# transitive: jetty-servlet has no 12.x publication and jetty-core has no 11.x
# publication (Jetty renamed/removed modules between 11.x and 12.x). Letting
# Javalin's BOM govern is the minimal fix.
picocli = "4.7.6"
zxing = "3.5.3"
slf4j = "2.0.13"
logback = "1.5.6"
junit = "5.10.2"
mockito = "5.12.0"
# shadow 8.1.1 (in the brief) was not published; the 8.x line starts at 8.3.0.
# 8.3.5 was incompatible with the Gradle 9 application plugin (mainClassName removal),
# so we use the first 9.x release, which is the line aligned with Gradle 9.
shadow = "9.0.0"
native = "0.10.2"

[libraries]
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
# Jetty is pulled in transitively via Javalin's jetty-bom.
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
zxing-javase = { module = "com.google.zxing:javase", version.ref = "zxing" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-inline = { module = "org.mockito:mockito-inline", version.ref = "mockito" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
native = { id = "org.graalvm.buildtools.native", version.ref = "native" }
foojay = { id = "org.gradle.toolchains.foojay-resolver-convention", version = "0.8.0" }
