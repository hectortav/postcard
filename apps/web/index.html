<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A private way to move a file between two devices on the same wifi." />
    <meta name="theme-color" content="#F4EEE2" />
    <meta name="theme-color" content="#1A1714" media="(prefers-color-scheme: dark)" />
    <!-- Served from the JAR alongside the bundle. Without these every dashboard load asked
         for /favicon.ico and got a 404, and adding the page to a phone's home screen had no
         icon to use. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="postcard" />
    <title>postcard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
